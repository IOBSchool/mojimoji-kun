<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>文字起こしもじもじくん</title>
<link rel="icon" href="icon.jpg">
<link rel="apple-touch-icon" href="icon.jpg">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="もじもじくん">
<meta name="theme-color" content="#f6e9f3">
<style>
  :root{
    --bg1:#fde8de; --bg2:#ece3fb; --bg3:#ddf5ec;
    --card:#ffffffd9; --ink:#3d3550; --sub:#7a7290;
    --accent:#b07ce0; --accent2:#ff9db2; --ok:#3fb68b; --line:#e7dff2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg1:#2a2238; --bg2:#1f2333; --bg3:#1d2b29;
      --card:#2b2740e6; --ink:#f1ecff; --sub:#b7aecd; --line:#3d3654;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    background-attachment:fixed;
  }
  .wrap{max-width:560px; margin:0 auto; padding:20px 16px 48px}
  header{display:flex; align-items:center; gap:12px; margin-bottom:18px}
  header img{width:60px; height:60px; border-radius:16px; box-shadow:0 4px 14px #b07ce040}
  header h1{font-size:20px; margin:0; line-height:1.3}
  header p{margin:2px 0 0; font-size:12px; color:var(--sub)}
  .tabs{display:flex; gap:8px; margin-bottom:14px}
  .tab{flex:1; padding:10px; border-radius:999px; border:1px solid var(--line);
       background:var(--card); color:var(--ink); font-size:14px; font-weight:600}
  .tab.on{background:var(--accent); color:#fff; border-color:var(--accent)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:22px;
        padding:16px; backdrop-filter:blur(8px); margin-bottom:14px}
  .mic{display:block; width:100%; padding:18px; border:0; border-radius:18px; font-size:18px;
       font-weight:700; color:#fff; background:linear-gradient(135deg,var(--accent2),var(--accent));
       box-shadow:0 6px 18px #b07ce055}
  .mic.rec{background:linear-gradient(135deg,#ff6b8a,#e0457b); animation:pulse 1.4s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 10px #ff6b8a33}}
  .status{font-size:13px; color:var(--sub); text-align:center; margin:10px 0 0; min-height:1.2em}
  textarea,input{width:100%; border:1px solid var(--line); border-radius:14px; padding:12px;
       font:inherit; font-size:16px; color:var(--ink); background:transparent}
  textarea{min-height:220px; resize:vertical; line-height:1.7}
  .interim{color:var(--sub); font-size:14px; min-height:1.4em; margin:8px 2px 0}
  .row{display:flex; gap:8px; margin-top:10px}
  .btn{flex:1; padding:13px 8px; border-radius:14px; border:1px solid var(--line);
       background:var(--card); color:var(--ink); font:inherit; font-size:15px; font-weight:700}
  .btn.main{background:var(--ink); color:var(--card); border-color:var(--ink)}
  label{font-size:13px; color:var(--sub); display:block; margin:12px 0 6px}
  .hidden{display:none}
  .toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--ink);
         color:var(--card); padding:10px 18px; border-radius:999px; font-size:14px; opacity:0;
         transition:.25s; pointer-events:none}
  .toast.show{opacity:1}
  details summary{cursor:pointer; font-size:14px; color:var(--sub)}
  .soon{text-align:center; color:var(--sub); font-size:14px; line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icon.jpg" alt="">
    <div>
      <h1>文字起こしもじもじくん</h1>
      <p>聞いた声を、そっと文字に。</p>
    </div>
  </header>

  <div class="tabs">
    <button class="tab on" data-tab="listen">🎙 その場で聞き取る</button>
    <button class="tab" data-tab="file">📁 ファイルから</button>
    <button class="tab" data-tab="link">🔗 リンク</button>
  </div>

  <section id="listen">
    <div class="card">
      <button id="mic" class="mic">🎙 聞き取りスタート</button>
      <p id="status" class="status">ボタンを押すと、マイクで聞き取りを始めます</p>
    </div>
  </section>

  <section id="file" class="hidden">
    <div class="card">
      <label class="mic" style="text-align:center;margin:0;color:#fff;position:relative;overflow:hidden">📁 動画・音声を選ぶ
        <input id="fileIn" type="file" accept="video/*,audio/*" style="position:absolute;width:1px;height:1px;opacity:0">
      </label>
      <p id="fstatus" class="status">画面収録した動画やボイスメモを選ぶと、文字にします</p>
    </div>
  </section>

  <section id="link" class="hidden">
    <div class="card">
      <input id="url" type="url" placeholder="FacebookやInstagramのリンクを貼る">
      <div class="row"><button id="go" class="btn main">🔗 文字にする</button></div>
      <p id="lstatus" class="status">リンクを貼って「文字にする」を押してね</p>
    </div>
  </section>

  <div class="card">
    <textarea id="text" placeholder="ここに文字がどんどん出てきます（直接書き直してもOK）"></textarea>
    <div id="interim" class="interim"></div>
    <label for="memo">メモ（元リンクや気づきなど・任意）</label>
    <input id="memo" placeholder="例：田中角栄の名言リール">
    <div class="row">
      <button id="copy" class="btn main">📋 コピー</button>
      <button id="save" class="btn">💾 スプシに保存</button>
      <button id="clear" class="btn">🧹 クリア</button>
    </div>
  </div>

  <div class="card">
    <details>
      <summary>⚙️ 保存先の設定</summary>
      <label for="gemKey">GeminiのAPIキー（ファイルから起こす用）</label>
      <input id="gemKey" type="password" placeholder="AIza... で始まるキー">
      <label for="server">リンク用サーバーURL</label>
      <input id="server" placeholder="https://mojimoji-server.onrender.com">
      <label for="stoken">リンク用サーバーの合言葉</label>
      <input id="stoken" type="password">
      <label for="gasUrl">保存先URL（GASのウェブアプリURL）</label>
      <input id="gasUrl" placeholder="https://script.google.com/macros/s/.../exec">
      <label for="token">合言葉</label>
      <input id="token" placeholder="GASに設定した合言葉">
      <label><input type="checkbox" id="autoSave" style="width:auto"> 聞き取りを止めたら自動で保存する</label>
      <div class="row"><button id="saveCfg" class="btn">設定を保存</button></div>
    </details>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k) || "" }catch(e){ return "" } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }

// タブ切り替え
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  ["listen","file","link"].forEach(t=>$(t).classList.toggle("hidden", b.dataset.tab!==t));
});

// 設定
$("gasUrl").value = store.get("gasUrl");
$("token").value = store.get("token");
$("gemKey").value = store.get("gemKey");
$("server").value = store.get("server") || "https://mojimoji-server.onrender.com";
$("stoken").value = store.get("stoken");
$("autoSave").checked = store.get("autoSave") === "1";
$("saveCfg").onclick = ()=>{
  store.set("gasUrl",$("gasUrl").value.trim());
  store.set("token",$("token").value.trim());
  store.set("gemKey",$("gemKey").value.trim());
  store.set("server",$("server").value.trim());
  store.set("stoken",$("stoken").value.trim());
  store.set("autoSave",$("autoSave").checked?"1":"0");
  toast("設定を保存しました");
};

// 聞き取り（Web Speech API）
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if(!SR){
  $("mic").disabled = true;
  $("status").textContent = "このブラウザは聞き取りに対応していません。iPhoneはSafari、AndroidはChromeで開いてください";
}
function startRec(){
  rec = new SR();
  rec.lang = "ja-JP";
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = e=>{
    let interim = "";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r = e.results[i];
      if(r.isFinal){
        const ta=$("text");
        ta.value += r[0].transcript.trim() + "\n";
        ta.scrollTop = ta.scrollHeight;
      } else interim += r[0].transcript;
    }
    $("interim").textContent = interim;
  };
  rec.onerror = e=>{
    if(e.error==="not-allowed") { $("status").textContent="マイクが許可されていません。設定でマイクをオンにしてください"; stopRec(); }
  };
  // 無音で止まっても、聞き取り中なら自動で再開する
  rec.onend = ()=>{ if(listening){ try{ rec.start() }catch(e){} } };
  rec.start();
}
function stopRec(){
  const was = listening;
  listening = false;
  if(rec) try{ rec.stop() }catch(e){}
  $("interim").textContent = "";
  $("mic").classList.remove("rec");
  $("mic").textContent = "🎙 聞き取りスタート";
  if($("status").textContent.startsWith("👂")) $("status").textContent = "止めました";
  if(was && $("autoSave").checked && $("text").value.trim()) save();
}
// スマホでは、画面が裏に回ると聞き取りが止まる（ブラウザの仕様）。戻ってきたら知らせて再開する
let wentHidden = false;
document.addEventListener("visibilitychange", ()=>{
  if(!listening) return;
  if(document.hidden){ wentHidden = true; return; }
  if(wentHidden){
    wentHidden = false;
    $("status").textContent = "⚠️ 裏に回っている間は聞き取れません。もじもじくんを開いたまま、音声は別の端末で流してください";
    try{ rec.start() }catch(e){}
  }
});
$("mic").onclick = ()=>{
  if(listening) return stopRec();
  listening = true;
  $("mic").classList.add("rec");
  $("mic").textContent = "⏹ 聞き取りストップ";
  $("status").textContent = "👂 聞き取り中…近くで音声を流してください";
  startRec();
};

// コピー
$("copy").onclick = async ()=>{
  const v=$("text").value;
  if(!v.trim()) return toast("まだ文字がありません");
  try{ await navigator.clipboard.writeText(v); }
  catch(e){ $("text").select(); document.execCommand("copy"); }
  toast("コピーしました！");
};

// ファイル・リンクから起こす（Gemini）
let lastMode = "聞き取り";
$("mic").addEventListener("click", ()=>{ lastMode = "聞き取り"; });

function withTimeout(promise, ms, msg){
  return Promise.race([promise, new Promise((_,ng)=>setTimeout(()=>ng(new Error(msg)), ms))]);
}
// 動画・音声から音だけ取り出し、16kHzモノラルのWAVに小さくする（送るデータを軽くするため）
async function toWav(file){
  const buf = await file.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  const audio = await new Promise((ok,ng)=>ctx.decodeAudioData(buf, ok, ng));
  ctx.close && ctx.close();
  const rate = 16000, len = Math.ceil(audio.duration*rate);
  const off = new OfflineAudioContext(1, len, rate);
  const src = off.createBufferSource(); src.buffer = audio; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const out = new DataView(new ArrayBuffer(44 + pcm.length*2));
  const w = (o,str)=>{ for(let i=0;i<str.length;i++) out.setUint8(o+i,str.charCodeAt(i)) };
  w(0,"RIFF"); out.setUint32(4,36+pcm.length*2,true); w(8,"WAVEfmt ");
  out.setUint32(16,16,true); out.setUint16(20,1,true); out.setUint16(22,1,true);
  out.setUint32(24,rate,true); out.setUint32(28,rate*2,true); out.setUint16(32,2,true); out.setUint16(34,16,true);
  w(36,"data"); out.setUint32(40,pcm.length*2,true);
  for(let i=0;i<pcm.length;i++){ const v=Math.max(-1,Math.min(1,pcm[i])); out.setInt16(44+i*2, v<0?v*0x8000:v*0x7fff, true); }
  return { blob: new Blob([out],{type:"audio/wav"}), seconds: audio.duration };
}
function toBase64(blob){
  return new Promise((ok,ng)=>{ const r=new FileReader(); r.onload=()=>ok(r.result.split(",")[1]); r.onerror=()=>ng(new Error("ファイルを読み込めませんでした")); r.readAsDataURL(blob); });
}
// 音声（Blob）を文字にして、テキスト欄に足す。st＝状況を表示する場所
async function transcribe(blob, st, mode, link){
  const key = store.get("gemKey");
  if(!key) throw new Error("⚙️設定にGeminiのAPIキーを入れてください");
  let audio, mime;
  st.textContent = "🎧 音を取り出しています…";
  try{
    const r = await withTimeout(toWav(blob), 60000, "timeout");
    if(r.seconds > 600) throw new Error("10分までの動画にしてください");
    audio = r.blob; mime = "audio/wav";
    st.textContent = "✍️ 文字にしています…（" + Math.round(r.seconds) + "秒の音声）";
  }catch(e){
    if(e.message.startsWith("10分")) throw e;
    // 音だけ取り出せない時は、元のファイルのまま送る（小さいファイルだけ）
    if(blob.size > 18*1024*1024) throw new Error("音を取り出せませんでした。短めの動画（1分くらい）で試してください");
    audio = blob; mime = blob.type || "video/mp4";
    st.textContent = "✍️ 文字にしています…";
  }
  const body = JSON.stringify({contents:[{parts:[
      {text:"この音声を文字起こししてください。\n- 話している言葉を、話されている言語のまま（翻訳せずに）句読点をつけて書き起こす\n- 日本語だけの音声なら、書き起こした本文だけを出力する\n- 日本語以外が含まれる場合は、次の形式で出力する：\n【原文（言語名）】\n（原文のまま）\n\n【日本語訳】\n（自然な日本語訳）\n- 要約・説明・前置きは不要\n- 音楽だけで言葉がなければ「（言葉はありませんでした）」と出力する"},
      {inline_data:{mime_type:mime, data: await toBase64(audio)}}
    ]}]});
  // 混み合っている時は、待ってやり直す。だめなら軽いモデルに切り替える
  const models = ["gemini-flash-latest","gemini-flash-latest","gemini-flash-lite-latest","gemini-flash-lite-latest"];
  let res, json;
  for(let i=0;i<models.length;i++){
    res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+models[i]+":generateContent",{
      method:"POST", headers:{"Content-Type":"application/json","x-goog-api-key":key}, body});
    json = await res.json().catch(()=>({}));
    if(res.ok || ![429,500,503].includes(res.status) || i===models.length-1) break;
    st.textContent = "⏳ AIが混み合っているので、少し待ってやり直しています…（" + (i+1) + "回目）";
    await new Promise(r=>setTimeout(r, 3000*(i+1)));
  }
  if(!res.ok) throw new Error(json.error && json.error.message || ("エラー " + res.status));
  const text = (json.candidates?.[0]?.content?.parts || []).map(p=>p.text||"").join("").trim();
  const ta = $("text");
  ta.value += (ta.value && !ta.value.endsWith("\n") ? "\n" : "") + text + "\n";
  lastMode = mode;
  if(link) $("memo").value = link;
  st.textContent = "✅ できました！下でコピー・保存できます";
  if($("autoSave").checked && text) save();
}

$("fileIn").addEventListener("change", async ()=>{
  const file = $("fileIn").files[0];
  if(!file) return;
  const st = $("fstatus");
  st.textContent = "📥 受け取りました：" + file.name + "（" + (file.size/1024/1024).toFixed(1) + "MB）";
  try{ await transcribe(file, st, "ファイル"); }
  catch(e){ st.textContent = "😢 うまくいきませんでした：" + e.message; }
  finally{ $("fileIn").value = ""; }
});

$("go").onclick = async ()=>{
  const url = $("url").value.trim(), st = $("lstatus");
  const server = (store.get("server") || "https://mojimoji-server.onrender.com").replace(/\/+$/,""), stoken = store.get("stoken");
  if(!/^https?:\/\//.test(url)) return st.textContent = "リンクを貼ってください";
  if(!server) return st.textContent = "⚙️設定に「リンク用サーバーURL」を入れてください";
  $("go").disabled = true;
  try{
    st.textContent = "🔗 リンクから音声を取りに行っています…（最初の1回は1分ほどかかります）";
    const res = await fetch(server + "/audio?token=" + encodeURIComponent(stoken) + "&url=" + encodeURIComponent(url));
    if(!res.ok){ const j = await res.json().catch(()=>({})); throw new Error(j.error || ("エラー " + res.status)); }
    await transcribe(await res.blob(), st, "リンク", url);
  }catch(e){ st.textContent = "😢 うまくいきませんでした：" + e.message; }
  finally{ $("go").disabled = false; }
};

// スプレッドシートに保存（GAS経由）
async function save(){
  const url = store.get("gasUrl"), token = store.get("token");
  const text = $("text").value.trim();
  if(!text) return toast("まだ文字がありません");
  if(!url) return toast("⚙️保存先の設定をしてください");
  const memo = $("memo").value.trim();
  try{
    await fetch(url,{method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({token, mode:lastMode, link: /^https?:\/\//.test(memo)?memo:"", text, memo})});
    toast("スプシに保存しました 💾");
  }catch(e){ toast("保存に失敗しました。電波を確認してください"); }
}
$("save").onclick = save;
$("clear").onclick = ()=>{ if(confirm("文字を消しますか？")){ $("text").value=""; $("memo").value=""; } };
</script>
</body>
</html>
